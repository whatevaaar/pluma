workflows:

  # ─────────────────────────────────────────────────────────────────────────
  # PR checks — analyze + test en cada pull request
  # ─────────────────────────────────────────────────────────────────────────
  pr-checks:
    name: PR Checks
    max_build_duration: 20
    instance_type: linux_x2

    environment:
      flutter: stable

    triggering:
      events:
        - pull_request

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Dart codegen
        script: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        script: flutter analyze --fatal-infos

      - name: Test
        script: flutter test

  # ─────────────────────────────────────────────────────────────────────────
  # iOS → TestFlight
  # Triggered on every push to main. Uploads to TestFlight automatically.
  # ─────────────────────────────────────────────────────────────────────────
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Dart codegen
        script: dart run build_runner build --delete-conflicting-outputs

      - name: Test
        script: flutter test

      - name: Set up keychain
        script: keychain initialize

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files com.sinananunciosnunca.pluma \
            --platform IOS \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply signing settings to Xcode project
        script: xcode-project use-profiles

      - name: Flutter build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --build-name=0.1.0 \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # ─────────────────────────────────────────────────────────────────────────
  # Android → APK debug
  # ─────────────────────────────────────────────────────────────────────────
  android-debug:
    name: Android APK (debug)
    max_build_duration: 30
    instance_type: linux_x2

    environment:
      flutter: stable

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Dart codegen
        script: dart run build_runner build --delete-conflicting-outputs

      - name: Test
        script: flutter test

      - name: Flutter build APK
        script: flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
