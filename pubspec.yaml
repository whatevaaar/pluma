name: pluma
description: A premium offline writing app. No ads. No account. No server.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  drift: ^2.21.0
  file_picker: ^12.0.0-beta.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_quill: ^11.5.1
  flutter_riverpod: ^3.4.2
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  hive_ce: ^2.9.0
  hive_ce_flutter: ^2.2.0
  intl: ^0.20.3
  json_annotation: ^4.9.0
  path: ^1.9.0
  path_provider: ^2.1.5
  pdf: ^3.13.0
  printing: ^5.13.2
  riverpod_annotation: ^4.0.6
  share_plus: ^13.3.0
  sqlite3_flutter_libs: ^0.6.0+eol
  uuid: ^4.5.1

dev_dependencies:
  alchemist: any
  build_runner: ^2.4.13
  drift_dev: ^2.28.0
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0-dev.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.9.5
  mocktail: ^1.0.4
  riverpod_generator: ^4.0.8
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-Regular.ttf
        - asset: assets/fonts/Merriweather-Bold.ttf
          weight: 700
        - asset: assets/fonts/Merriweather-Italic.ttf
          style: italic
        - asset: assets/fonts/Merriweather-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
